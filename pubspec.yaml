name: micee
description: A new Flutter project.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.1.4 <4.0.0'

dependencies:
  email_validator: ^2.1.17
  encrypt: ^5.0.3
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_screenutil: ^5.9.0
  get_storage: ^2.1.1
  icons_plus: ^5.0.0
  phone_form_field: ^9.2.3
  cupertino_icons: ^1.0.5
  intl: ^0.18.1
  http: ^1.1.2
  xml: ^6.5.0
  google_fonts: ^6.1.0
  easy_sidemenu: ^0.6.0
  font_awesome_flutter: ^10.6.0
  dropdown_button2: ^2.3.9
  select_field: ^1.0.0
  xml2json: ^6.2.2
  file_picker: ^8.0.0+1
  syncfusion_flutter_pdfviewer: ^25.1.39
  download: ^1.0.0
  simple_grid: ^0.1.4
  charts_painter: ^3.1.1
  pie_chart: ^5.4.0
  syncfusion_flutter_datepicker: ^25.1.39
  mysql_client: ^0.0.27
  bitsdojo_window: ^0.1.6
  path_provider: ^2.1.3
  pull_down_button: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/micee-favicon-color.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  web:
    generate: true
    image_path: "assets/micee-favicon-color.png"
    #background_color: "#hexcode"
    #theme_color: "#hexcode"
  windows:
    generate: true
    image_path: "assets/micee-favicon-color.png"
    icon_size: 256 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "assets/micee-favicon-color.png"

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/sounds/
